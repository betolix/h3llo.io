<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#172033;--border:#334155;--fg:#f1f5f9;--muted:#94a3b8;--accent:#38bdf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,sans-serif}main{max-width:1060px;margin:auto;padding:28px 18px}header,.toolbar,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:var(--accent)}.panel,.note{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;margin:16px 0}h1{margin:18px 0 0;font-size:clamp(26px,4vw,38px)}h2{margin-top:0}p,.small{color:var(--muted)}label{display:block;font-size:14px;margin:12px 0 4px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;background:#0b1120;color:var(--fg);border:1px solid #475569;border-radius:8px;padding:10px}textarea{min-height:140px;resize:vertical}.rich{min-height:180px;background:#0b1120;border:1px solid #475569;border-radius:8px;padding:12px;overflow-wrap:anywhere}.rich img{max-width:100%;height:auto;display:block;margin:12px 0}.rich:focus{outline:2px solid var(--accent)}.note .body img{max-width:100%;height:auto}.note .body{overflow-wrap:anywhere}.pinned{outline:2px solid var(--accent)}button{background:var(--accent);color:#07121e;border:0;border-radius:8px;padding:10px 16px;font-weight:650;cursor:pointer}button.secondary{background:#334155;color:var(--fg)}button.danger{background:#7f1d1d;color:#fff}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.note{margin:0;overflow-wrap:anywhere}.note p{white-space:pre-wrap;color:var(--fg)}.note small{color:var(--muted)}.hidden{display:none!important}.message{min-height:24px}#login{max-width:440px}#notes{margin-top:18px}.tag{display:inline-block;border:1px solid var(--border);border-radius:20px;padding:2px 10px;color:var(--muted);font-size:12px;margin-right:6px}

<script>
'use strict';
const REGION='us-east-1',CLIENT='r0civi0co7ee2hs3154g1vsnf',API='https://v2o5gtwin6.execute-api.us-east-1.amazonaws.com/prod/notes';
const AUTH='https://cognito-idp.'+REGION+'.amazonaws.com/';
const $=id=>document.getElementById(id);
let tokens=null,notes=[],editorDirty=false,editorSaving=false,editorOpening=false,selectedImage=null,savedImageRange=null,imageUploading=false,movingImage=null;
function message(text){$('message').textContent=text||''}
function showSignedIn(yes){$('login').classList.toggle('hidden',yes);$('workspace').classList.toggle('hidden',!yes);$('logout').classList.toggle('hidden',!yes)}
function signOut(){tokens=null;sessionStorage.removeItem('h3llo-workspace-session');$('password').value='';notes=[];showSignedIn(false);message('Signed out.')}
async function cognito(action,payload){const response=await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/x-amz-json-1.1','X-Amz-Target':'AWSCognitoIdentityProviderService.'+action},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok)throw Error(data.message||data.Message||'Authentication failed');return data}
async function signIn(email,password){const data=await cognito('InitiateAuth',{AuthFlow:'USER_PASSWORD_AUTH',ClientId:CLIENT,AuthParameters:{USERNAME:email,PASSWORD:password}});if(data.ChallengeName)throw Error('Cognito requires an additional sign-in challenge: '+data.ChallengeName+'. Complete it through the AWS CLI before using this page.');if(!data.AuthenticationResult?.IdToken)throw Error('No ID token returned');tokens={...data.AuthenticationResult,obtainedAt:Date.now()};sessionStorage.setItem('h3llo-workspace-session',JSON.stringify(tokens));$('password').value='';showSignedIn(true);await loadNotes()}
async function getIdToken(){if(!tokens)throw Error('Please sign in');if(Date.now()-tokens.obtainedAt<Math.max(60,(tokens.ExpiresIn||3600)-120)*1000)return tokens.IdToken;if(!tokens.RefreshToken){signOut();throw Error('Session expired. Sign in again.')}const refreshed=await cognito('InitiateAuth',{AuthFlow:'REFRESH_TOKEN_AUTH',ClientId:CLIENT,AuthParameters:{REFRESH_TOKEN:tokens.RefreshToken}});tokens={...tokens,...refreshed.AuthenticationResult,obtainedAt:Date.now()};sessionStorage.setItem('h3llo-workspace-session',JSON.stringify(tokens));return tokens.IdToken}
async function api(method='GET',payload=null,id=null,endpoint=''){const token=await getIdToken();const url=(endpoint?API.replace(/\/notes$/,'')+endpoint:API)+(id?'?id='+encodeURIComponent(id):'');const response=await fetch(url,{method,headers:{Authorization:'Bearer '+token,...(payload?{'Content-Type':'application/json'}:{})},...(payload?{body:JSON.stringify(payload)}:{})});const data=await response.json().catch(()=>({}));if(response.status===401){signOut();throw Error('Session rejected. Please sign in again.')}if(!response.ok)throw Error(data.error||data.message||'API request failed: '+response.status);return data}
async function loadNotes(){message('Loading notes…');const data=await api();notes=data.notes||[];render();message(data.truncated?'Showing first page of notes.':'')}
const IMAGE_KEY_RE=/^[a-zA-Z0-9_-]+\/[a-zA-Z0-9_-]+$/;
function safeHtml(raw){
 const doc=new DOMParser().parseFromString(String(raw||''),'text/html');
 const allowed=new Set(['P','DIV','BR','B','STRONG','I','EM','U','H2','H3','UL','OL','LI','BLOCKQUOTE','PRE','CODE','IMG','A','SPAN']);
 function clean(parent){
  for(const node of [...parent.childNodes]){
   if(node.nodeType===8){node.remove();continue}
   if(node.nodeType!==1){if(node.nodeType!==3)node.remove();continue}
   const tag=node.tagName;
   if(['SCRIPT','STYLE','SVG','MATH','IFRAME','OBJECT','EMBED','FORM','INPUT','BUTTON','VIDEO','AUDIO','TEMPLATE','NOSCRIPT'].includes(tag)){node.remove();continue}
   if(!allowed.has(tag)){clean(node);node.replaceWith(...node.childNodes);continue}
   const key=node.getAttribute('data-key');
   const width=node.getAttribute('data-width');
   const href=node.getAttribute('href');
   for(const attr of [...node.attributes])node.removeAttribute(attr.name);
   if(tag==='IMG'){
    if(!key||!IMAGE_KEY_RE.test(key)){node.remove();continue}
    node.setAttribute('data-key',key);
    if(width&&/^\d{1,3}$/.test(width)){const w=Number(width);if(w>=15&&w<=100)node.setAttribute('data-width',String(w))}
   }
   if(tag==='A'&&href){try{const u=new URL(href);if(['https:','http:'].includes(u.protocol)){node.setAttribute('href',u.href);node.setAttribute('rel','noopener noreferrer');node.setAttribute('target','_blank')}}catch{}}
   clean(node);
  }
 }
 clean(doc.body);return doc.body.innerHTML;
}
function bodyIsHtml(n){return typeof n.body==="string"&&n.body.startsWith("<!--rich-->")}
async function hydrateImages(root){for(const img of root.querySelectorAll("img[data-key]")){try{const result=await api("GET",null,null,"/images?key="+encodeURIComponent(img.dataset.key));img.src=result.url;img.alt="Note image";if(img.dataset.width)img.style.width=img.dataset.width+"%"}catch{img.alt="Image unavailable"}}}
function refreshFilters(){const categories=[...new Set(notes.map(n=>n.category).filter(Boolean))].sort(),tags=[...new Set(notes.flatMap(n=>Array.isArray(n.tags)?n.tags:[]))].sort();for(const [id,values,label] of [["categoryFilter",categories,"All categories"],["tagFilter",tags,"All tags"]]){const el=$(id),current=el.value;el.replaceChildren(new Option(label,""),...values.map(v=>new Option(v,v)));el.value=values.includes(current)?current:""}}
function render(){refreshFilters();const root=$('notes');root.replaceChildren();const query=$('search').value.trim().toLowerCase();const filtered=notes.filter(n=>(!$("categoryFilter").value||n.category===$("categoryFilter").value)&&(!$("tagFilter").value||(n.tags||[]).includes($("tagFilter").value))&&[n.title,n.body,n.category,n.status,...(n.tags||[])].some(v=>String(v||"").toLowerCase().includes(query))).sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned));if(!filtered.length){const p=document.createElement('p');p.textContent='No notes found. Create your first note.';root.append(p);return}for(const n of filtered){const card=document.createElement('article');card.className='note'+(n.pinned?' pinned':'');card.style.backgroundColor=/^#[0-9a-f]{6}$/i.test(n.color||'')?n.color:'#172033';const h=document.createElement('h3');h.textContent=n.title||'Untitled';const meta=document.createElement('div');meta.className='note-footer';for(const value of [n.category]){const tag=document.createElement('span');tag.className='tag';tag.textContent=value||'';meta.append(tag)}const body=document.createElement('p');body.className='body';if(bodyIsHtml(n)){body.innerHTML=safeHtml(n.body.slice(11));hydrateImages(body)}else body.textContent=n.body||'';const actions=document.createElement('div');actions.className='actions';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label','Edit '+(n.title||'Untitled'));card.addEventListener('click',e=>{if(!e.target.closest('button'))openEditor(n)});card.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===card){e.preventDefault();openEditor(n)}});const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>deleteNote(n);const pin=document.createElement('button');pin.className='pin-icon';pin.type='button';pin.setAttribute('aria-label',n.pinned?'Unpin note':'Pin note');pin.setAttribute('aria-pressed',String(!!n.pinned));pin.title=n.pinned?'Unpin note':'Pin note';pin.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3l5 5-4 1-3 5-4 1-5 6 1-8 4-4 1-4z"/><path d="m2 22 6-6"/></svg>';pin.onclick=async()=>{try{await saveNote({...n,pinned:!n.pinned});await loadNotes()}catch(e){message(e.message)}};actions.append(del);for(const t of n.tags||[]){const tag=document.createElement('span');tag.className='tag';tag.textContent='#'+t;meta.append(tag)}const dot=document.createElement('span');dot.className='color-dot';dot.style.backgroundColor=/^#[0-9a-f]{6}$/i.test(n.color||'')?n.color:'#172033';dot.title='Card color';meta.append(dot);card.append(pin,h,body,meta,actions);root.append(card)}}
async function saveNote(n){return api('POST',{id:n.noteId||n.id,title:n.title,body:n.body,category:n.category,status:n.status,color:n.color||'#172033',pinned:!!n.pinned,tags:n.tags||[]})}
function openEditor(n){selectedImage=null;$('imageResize').disabled=true;if(!$('editor').classList.contains('hidden')&&editorDirty){message('Save or cancel the current note before opening another.');return}editorOpening=true;editorDirty=false;$('editor').classList.remove('hidden');document.body.classList.add('editor-open');$('editorTitle').textContent=n?'Edit note':'New note';$('noteId').value=n?.noteId||'';$('title').value=n?.title||'';$('bodyRich').innerHTML=n?(bodyIsHtml(n)?safeHtml(n.body.slice(11)):safeHtml((n.body||'').split('\n').map(line=>'<p>'+line.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</p>').join(''))):'';hydrateImages($('bodyRich'));$('tags').value=(n?.tags||[]).join(', ');$('color').value=/^#[0-9a-f]{6}$/i.test(n?.color||'')?n.color:'#172033';$('pinned').checked=!!n?.pinned;$('category').value=n?.category||'Kotlin';$('status').value=n?.status||'To Learn';$('title').focus();setTimeout(()=>{editorOpening=false},0)}
async function deleteNote(n){if(!confirm('Delete "'+n.title+'"?'))return;try{await api('DELETE',null,n.noteId);await loadNotes()}catch(e){message(e.message)}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;message('Signing in…');try{await signIn($('email').value.trim(),$('password').value)}catch(err){message(err.message)}finally{button.disabled=false}});
function closeEditorView(){document.body.classList.remove('editor-open');$('editor').classList.add('hidden')}
function editorPayload(){return {id:$('noteId').value||undefined,title:$('title').value,body:'<!--rich-->'+safeHtml($('bodyRich').innerHTML),category:$('category').value,status:$('status').value,color:$('color').value,pinned:$('pinned').checked,tags:[...new Set($('tags').value.split(',').map(x=>x.trim()).filter(Boolean))].slice(0,20)}}
async function saveEditor(){if(imageUploading){message('Wait for the image upload to finish before saving.');return}if(editorSaving||$('editor').classList.contains('hidden'))return;const title=$('title').value.trim();if(!title){message('A title is required before saving.');$('title').focus();return}editorSaving=true;try{await saveNote(editorPayload());editorDirty=false;closeEditorView();await loadNotes()}catch(err){message('Save failed: '+err.message+'. Your editor remains open.')}finally{editorSaving=false}}
$('noteForm').addEventListener('submit',async e=>{e.preventDefault();await saveEditor()});
$('noteForm').addEventListener('input',()=>{editorDirty=true});$('noteForm').addEventListener('change',()=>{editorDirty=true});
document.addEventListener('pointerdown',e=>{if(editorOpening||editorSaving||$('editor').classList.contains('hidden'))return;if($('editor').contains(e.target))return;if(e.target.closest('#logout'))return;if(editorDirty)void saveEditor();else closeEditorView()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('editor').classList.contains('hidden')){e.preventDefault();if(editorDirty)void saveEditor();else closeEditorView()}});

async function importStarters(){
 const button=$('importStarters');button.disabled=true;
 let imported=0,skipped=0;
 try{
  const response=await fetch('./starter-notes.json',{cache:'no-store'});
  if(!response.ok)throw Error('Could not load starter notes ('+response.status+')');
  const data=await response.json();
  if(!Array.isArray(data.notes)||data.notes.length!==13)throw Error('Unexpected starter note format');
  await loadNotes();
  if(!confirm('Import the 13 original Android starter notes into your cloud workspace? Existing notes will be preserved.'))return;
  const existing=new Set(notes.map(n=>n.noteId));
  for(const n of data.notes){
   if(existing.has(n.id)){skipped++;continue}
   await api('POST',{id:n.id,title:n.title,body:n.body,category:n.category,status:n.status});
   existing.add(n.id);imported++;
  }
  await loadNotes();
  message('Imported '+imported+' starter notes; skipped '+skipped+' already present.');
 }catch(e){message('Imported '+imported+' notes before error: '+e.message+'. Retry to finish safely.')}
 finally{button.disabled=false}
}
$('importStarters').onclick=importStarters;
$('categoryFilter').onchange=render;$('tagFilter').onchange=render;
$('boldBtn').onclick=()=>document.execCommand('bold');$('italicBtn').onclick=()=>document.execCommand('italic');
function markEditorDirty(){editorDirty=true}
function selectImage(img){
 if(selectedImage)selectedImage.classList.remove('selected-image');
 selectedImage=img&&$('bodyRich').contains(img)?img:null;
 $('imageResize').disabled=!selectedImage;
 if(selectedImage){selectedImage.classList.add('selected-image');$('imageResize').value=selectedImage.dataset.width||'100'}
}
$('bodyRich').addEventListener('click',e=>selectImage(e.target.closest('img[data-key]')));
$('imageResize').addEventListener('input',()=>{if(!selectedImage)return;selectedImage.dataset.width=$('imageResize').value;selectedImage.style.width=$('imageResize').value+'%';markEditorDirty()});
function saveCaret(){const sel=window.getSelection();if(sel&&sel.rangeCount&&$('bodyRich').contains(sel.anchorNode))savedImageRange=sel.getRangeAt(0).cloneRange()}
$('bodyRich').addEventListener('keyup',saveCaret);
$('bodyRich').addEventListener('mouseup',saveCaret);
$('imageBtn').addEventListener('pointerdown',saveCaret);
$('imageBtn').onclick=()=>$('imageFile').click();
function insertionRangeAt(x,y){if(document.caretRangeFromPoint)return document.caretRangeFromPoint(x,y);if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y);if(p){const r=document.createRange();r.setStart(p.offsetNode,p.offset);r.collapse(true);return r}}return null}
function insertAtRange(node,range){
 const root=$('bodyRich');root.focus();
 if(range&&root.contains(range.commonAncestorContainer)){range.deleteContents();range.insertNode(node)}
 else root.append(node);
 const after=document.createRange();after.setStartAfter(node);after.collapse(true);
 const sel=window.getSelection();sel.removeAllRanges();sel.addRange(after);savedImageRange=after.cloneRange();
 markEditorDirty();
}
async function uploadImage(file,range){
 if(!file||!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)){message('Use PNG, JPEG, WebP or GIF images.');return}
 if(file.size>5*1024*1024){message('Maximum image size is 5 MB');return}
 if(imageUploading){message('Another image is uploading. Please wait.');return}
 imageUploading=true;
 try{
  message('Uploading image…');
  const upload=await api('POST',{contentType:file.type},null,'/images');
  const form=new FormData();for(const [k,v] of Object.entries(upload.upload.fields))form.append(k,v);form.append('file',file);
  const response=await fetch(upload.upload.url,{method:'POST',body:form});
  if(!response.ok)throw Error('S3 upload failed: '+response.status);
  const view=await api('GET',null,null,'/images?key='+encodeURIComponent(upload.key));
  const img=document.createElement('img');img.dataset.key=upload.key;img.src=view.url;img.alt='Note image';
  insertAtRange(img,range);selectImage(img);
  message('Image uploaded. Click outside the editor to save.');
 }catch(e){message(e.message)}finally{imageUploading=false}
}
$('imageFile').onchange=async()=>{const file=$('imageFile').files[0];await uploadImage(file,savedImageRange);$('imageFile').value=''};
$('bodyRich').addEventListener('paste',e=>{const file=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/'));if(file){e.preventDefault();saveCaret();void uploadImage(file,savedImageRange)}});
$('bodyRich').addEventListener('dragstart',e=>{
 const img=e.target.closest('img[data-key]');
 if(!img)return;
 movingImage=img;
 e.dataTransfer.effectAllowed='move';
 e.dataTransfer.setData('text/plain','h3llo-internal-image');
 selectImage(img);
});
$('bodyRich').addEventListener('dragend',()=>{movingImage=null;$('bodyRich').classList.remove('drag-over')});
$('bodyRich').addEventListener('dragover',e=>{
 if(movingImage||[...e.dataTransfer.types].includes('Files')){
  e.preventDefault();e.dataTransfer.dropEffect=movingImage?'move':'copy';
  $('bodyRich').classList.add('drag-over');
 }
});
$('bodyRich').addEventListener('dragleave',e=>{if(!e.currentTarget.contains(e.relatedTarget))$('bodyRich').classList.remove('drag-over')});
$('bodyRich').addEventListener('drop',e=>{
 e.preventDefault();$('bodyRich').classList.remove('drag-over');
 const range=insertionRangeAt(e.clientX,e.clientY);
 if(movingImage){
  const img=movingImage;movingImage=null;
  if(!range||!$('bodyRich').contains(range.commonAncestorContainer))return;
  if(img.contains(range.commonAncestorContainer))return;
  // Preserve the same image node and its persisted S3 key and width.
  const target=range.cloneRange();target.collapse(true);
  img.remove();target.insertNode(img);
  selectImage(img);markEditorDirty();
  message('Image moved. Click outside to save.');
  return;
 }
 const file=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/'));
 if(file)void uploadImage(file,range);
});

$('newNote').onclick=()=>openEditor(null);$('cancel').onclick=()=>{editorDirty=false;closeEditorView()};$('closeEditor').onclick=()=>{if(editorDirty)void saveEditor();else closeEditorView()};$('refresh').onclick=()=>loadNotes().catch(e=>message(e.message));$('search').oninput=render;$('logout').onclick=signOut;
try{tokens=JSON.parse(sessionStorage.getItem('h3llo-workspace-session')||'null')}catch{tokens=null}
if(tokens?.IdToken){showSignedIn(true);loadNotes().catch(e=>message(e.message))}
</script></body></html>
