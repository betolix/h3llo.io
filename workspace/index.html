<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Android Learning Hub | h3llo.io</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#172033;--border:#334155;--fg:#f1f5f9;--muted:#94a3b8;--accent:#38bdf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,sans-serif}main{max-width:1060px;margin:auto;padding:28px 18px}header,.toolbar,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:var(--accent)}.panel,.note{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;margin:16px 0}h1{margin:18px 0 0;font-size:clamp(26px,4vw,38px)}h2{margin-top:0}p,.small{color:var(--muted)}label{display:block;font-size:14px;margin:12px 0 4px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;background:#0b1120;color:var(--fg);border:1px solid #475569;border-radius:8px;padding:10px}textarea{min-height:140px;resize:vertical}button{background:var(--accent);color:#07121e;border:0;border-radius:8px;padding:10px 16px;font-weight:650;cursor:pointer}button.secondary{background:#334155;color:var(--fg)}button.danger{background:#7f1d1d;color:#fff}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.note{margin:0;overflow-wrap:anywhere}.note p{white-space:pre-wrap;color:var(--fg)}.note small{color:var(--muted)}.hidden{display:none!important}.message{min-height:24px}#login{max-width:440px}#notes{margin-top:18px}.tag{display:inline-block;border:1px solid var(--border);border-radius:20px;padding:2px 10px;color:var(--muted);font-size:12px;margin-right:6px}
</style></head><body><main>
<header><a href="/">← h3llo.io</a><span>Private workspace · Android Learning Hub</span><button id="logout" class="secondary hidden" type="button">Log out</button></header>
<h1>Android Learning Hub</h1><p>Your private Kotlin and Android learning notes, synchronized through your AWS notes API.</p>
<div id="message" class="message" role="status" aria-live="polite"></div>
<section id="login" class="panel"><h2>Sign in</h2><form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required value="betolix@gmail.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p class="small">Use your Cognito password. Credentials are sent directly to Amazon Cognito, not to this website's server.</p><button type="submit">Sign in</button></form></section>
<section id="workspace" class="hidden">
<div class="toolbar"><h2>My notes</h2><button id="newNote" type="button">+ New note</button></div>
<div class="toolbar"><input id="search" placeholder="Search notes" aria-label="Search notes" style="max-width:420px"><button id="refresh" class="secondary" type="button">Refresh</button><button id="importStarters" class="secondary" type="button">Import 13 starter notes</button></div>
<div id="notes" class="grid"></div>
<section id="editor" class="panel hidden"><h2 id="editorTitle">New note</h2><form id="noteForm"><input id="noteId" type="hidden"><label for="title">Title</label><input id="title" maxlength="200" required><label for="category">Category</label><select id="category"><option>Kotlin</option><option>Concurrency</option><option>Architecture</option><option>Jetpack Compose</option><option>Quality</option><option>Backend</option><option>Projects</option><option>Roadmap</option></select><label for="status">Progress</label><select id="status"><option>To Learn</option><option>Learning</option><option>Review</option><option>Confident</option></select><label for="body">Notes</label><textarea id="body" maxlength="30000"></textarea><div class="actions"><button type="submit">Save note</button><button id="cancel" class="secondary" type="button">Cancel</button></div></form></section>
</section></main>
<script>
'use strict';
const REGION='us-east-1',CLIENT='r0civi0co7ee2hs3154g1vsnf',API='https://v2o5gtwin6.execute-api.us-east-1.amazonaws.com/prod/notes';
const AUTH='https://cognito-idp.'+REGION+'.amazonaws.com/';
const $=id=>document.getElementById(id);
let tokens=null,notes=[];
function message(text){$('message').textContent=text||''}
function showSignedIn(yes){$('login').classList.toggle('hidden',yes);$('workspace').classList.toggle('hidden',!yes);$('logout').classList.toggle('hidden',!yes)}
function signOut(){tokens=null;sessionStorage.removeItem('h3llo-workspace-session');$('password').value='';notes=[];showSignedIn(false);message('Signed out.')}
async function cognito(action,payload){const response=await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/x-amz-json-1.1','X-Amz-Target':'AWSCognitoIdentityProviderService.'+action},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok)throw Error(data.message||data.Message||'Authentication failed');return data}
async function signIn(email,password){const data=await cognito('InitiateAuth',{AuthFlow:'USER_PASSWORD_AUTH',ClientId:CLIENT,AuthParameters:{USERNAME:email,PASSWORD:password}});if(data.ChallengeName)throw Error('Cognito requires an additional sign-in challenge: '+data.ChallengeName+'. Complete it through the AWS CLI before using this page.');if(!data.AuthenticationResult?.IdToken)throw Error('No ID token returned');tokens={...data.AuthenticationResult,obtainedAt:Date.now()};sessionStorage.setItem('h3llo-workspace-session',JSON.stringify(tokens));$('password').value='';showSignedIn(true);await loadNotes()}
async function getIdToken(){if(!tokens)throw Error('Please sign in');if(Date.now()-tokens.obtainedAt<Math.max(60,(tokens.ExpiresIn||3600)-120)*1000)return tokens.IdToken;if(!tokens.RefreshToken){signOut();throw Error('Session expired. Sign in again.')}const refreshed=await cognito('InitiateAuth',{AuthFlow:'REFRESH_TOKEN_AUTH',ClientId:CLIENT,AuthParameters:{REFRESH_TOKEN:tokens.RefreshToken}});tokens={...tokens,...refreshed.AuthenticationResult,obtainedAt:Date.now()};sessionStorage.setItem('h3llo-workspace-session',JSON.stringify(tokens));return tokens.IdToken}
async function api(method='GET',payload=null,id=null){const token=await getIdToken();const url=API+(id?'?id='+encodeURIComponent(id):'');const response=await fetch(url,{method,headers:{Authorization:'Bearer '+token,...(payload?{'Content-Type':'application/json'}:{})},...(payload?{body:JSON.stringify(payload)}:{})});const data=await response.json().catch(()=>({}));if(response.status===401){signOut();throw Error('Session rejected. Please sign in again.')}if(!response.ok)throw Error(data.error||data.message||'API request failed: '+response.status);return data}
async function loadNotes(){message('Loading notes…');const data=await api();notes=data.notes||[];render();message(data.truncated?'Showing first page of notes.':'')}
function render(){const root=$('notes');root.replaceChildren();const query=$('search').value.trim().toLowerCase();const filtered=notes.filter(n=>[n.title,n.body,n.category,n.status].some(v=>String(v||'').toLowerCase().includes(query)));if(!filtered.length){const p=document.createElement('p');p.textContent='No notes found. Create your first note.';root.append(p);return}for(const n of filtered){const card=document.createElement('article');card.className='note';const h=document.createElement('h3');h.textContent=n.title||'Untitled';const meta=document.createElement('div');for(const value of [n.category,n.status]){const tag=document.createElement('span');tag.className='tag';tag.textContent=value||'';meta.append(tag)}const body=document.createElement('p');body.textContent=n.body||'';const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit';edit.onclick=()=>openEditor(n);const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>deleteNote(n);actions.append(edit,del);card.append(h,meta,body,actions);root.append(card)}}
function openEditor(n){$('editor').classList.remove('hidden');$('editorTitle').textContent=n?'Edit note':'New note';$('noteId').value=n?.noteId||'';$('title').value=n?.title||'';$('body').value=n?.body||'';$('category').value=n?.category||'Kotlin';$('status').value=n?.status||'To Learn';$('editor').scrollIntoView({behavior:'smooth'});$('title').focus()}
async function deleteNote(n){if(!confirm('Delete "'+n.title+'"?'))return;try{await api('DELETE',null,n.noteId);await loadNotes()}catch(e){message(e.message)}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;message('Signing in…');try{await signIn($('email').value.trim(),$('password').value)}catch(err){message(err.message)}finally{button.disabled=false}});
$('noteForm').addEventListener('submit',async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{await api('POST',{id:$('noteId').value||undefined,title:$('title').value,body:$('body').value,category:$('category').value,status:$('status').value});$('editor').classList.add('hidden');await loadNotes()}catch(err){message(err.message)}finally{button.disabled=false}});

async function importStarters(){
 const button=$('importStarters');button.disabled=true;
 let imported=0,skipped=0;
 try{
  const response=await fetch('./starter-notes.json',{cache:'no-store'});
  if(!response.ok)throw Error('Could not load starter notes ('+response.status+')');
  const data=await response.json();
  if(!Array.isArray(data.notes)||data.notes.length!==13)throw Error('Unexpected starter note format');
  await loadNotes();
  if(!confirm('Import the 13 original Android starter notes into your cloud workspace? Existing notes will be preserved.'))return;
  const existing=new Set(notes.map(n=>n.noteId));
  for(const n of data.notes){
   if(existing.has(n.id)){skipped++;continue}
   await api('POST',{id:n.id,title:n.title,body:n.body,category:n.category,status:n.status});
   existing.add(n.id);imported++;
  }
  await loadNotes();
  message('Imported '+imported+' starter notes; skipped '+skipped+' already present.');
 }catch(e){message('Imported '+imported+' notes before error: '+e.message+'. Retry to finish safely.')}
 finally{button.disabled=false}
}
$('importStarters').onclick=importStarters;
$('newNote').onclick=()=>openEditor(null);$('cancel').onclick=()=>$('editor').classList.add('hidden');$('refresh').onclick=()=>loadNotes().catch(e=>message(e.message));$('search').oninput=render;$('logout').onclick=signOut;
try{tokens=JSON.parse(sessionStorage.getItem('h3llo-workspace-session')||'null')}catch{tokens=null}
if(tokens?.IdToken){showSignedIn(true);loadNotes().catch(e=>message(e.message))}
</script></body></html>
