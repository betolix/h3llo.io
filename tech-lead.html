:root{--bg:#f1efe8;--fg:#111;--muted:#696a66;--line:#c8c5bd;--accent:#ff5c35}html[data-theme=dark]{--bg:#0f1113;--fg:#f2f1eb;--muted:#a6aaa5;--line:#414447}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}a{color:inherit}.wrap{width:min(100% - 40px,1000px);margin:auto}header{border-bottom:1px solid var(--line);padding:24px 0}header .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}main{padding:80px 0 100px}.kicker{color:var(--accent);font-weight:800;letter-spacing:.14em;font-size:.75rem;text-transform:uppercase}h1{font-size:clamp(2.6rem,7vw,5.8rem);letter-spacing:-.06em;line-height:1.02;margin:20px 0 30px}p{color:var(--muted);font-size:1.15rem;line-height:1.7;max-width:760px}.section{border-top:1px solid var(--line);padding:28px 0;margin-top:38px}h2{font-size:1.15rem}.tags{display:flex;gap:10px;flex-wrap:wrap}.tag{border:1px solid var(--line);padding:9px 13px;border-radius:100px;font-size:.85rem}.button{display:inline-block;padding:14px 20px;border-radius:100px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:800;margin:15px 10px 0 0}button{cursor:pointer;border:1px solid var(--line);background:none;color:var(--fg);padding:8px;border-radius:6px}footer{padding:30px 0;border-top:1px solid var(--line);color:var(--muted)}@media(max-width:600px){main{padding-top:45px}}

(function(){const slug=location.pathname.split('/').pop().replace(/\.html$/,'');const p=(window.H3LLO_PROFILES||[]).find(x=>x.slug===slug);if(!p){location.replace('profiles.html');return;}const $=id=>document.getElementById(id);const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};let lang=get('alberto-site-language')||'en';let theme=get('alberto-site-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');function draw(){document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;document.title=p.title+' — Alberto Lazo';$('title').textContent=p.title;$('summary').textContent=p[lang];$('skills').replaceChildren(...p.tags.map(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t;return s}));$('resume').href=p.cv;const es=lang==='es';$('kicker').textContent=es?'Perfil profesional':'Professional profile';$('skills-title').textContent=es?'Competencias principales':'Core competencies';$('resume-title').textContent=es?'Currículum específico':'Role-specific résumé';$('resume-note').textContent=es?'Consulta el CV correspondiente para conocer mi experiencia y trayectoria.':'View the corresponding CV for experience and career details.';$('resume').textContent=es?'Ver CV ↗':'View CV ↗';$('connect-title').textContent=es?'Contacto':'Connect';$('back').textContent=es?'← Todos los perfiles':'← All profiles';} $('lang').onclick=()=>{lang=lang==='en'?'es':'en';try{localStorage.setItem('alberto-site-language',lang)}catch(e){}draw()};$('theme').onclick=()=>{theme=theme==='light'?'dark':'light';try{localStorage.setItem('alberto-site-theme',theme)}catch(e){}draw()};draw()})();
</script><script src="track.js"></script></body></html>
